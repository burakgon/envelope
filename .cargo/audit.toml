# `cargo audit` settings (https://github.com/rustsec/rustsec).
[advisories]
# Both arrive with rPGP (pgp 0.21, its latest release) and with envelope-smime,
# which uses the same RustCrypto releases (rsa 0.9, the 0.13 curves), and
# have no fixed release to move to yet: RSA decryption timing (Marvin) and
# timing variability in crypto-bigint 0.5. Exploiting them takes precise
# timing of many decryptions on the user's machine; Envelope decrypts mail
# locally and never offers decryption as a service. Revisit when rPGP and
# the next RustCrypto releases (rsa 0.10, the 0.14 curves) move on.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]
