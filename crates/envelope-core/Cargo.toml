[package]
name = "envelope-core"
description = "Sync engine, storage, protocols and AI layer for the Envelope mail client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dirs = "7.0.0"
envelope-imap = { version = "0.1.0", path = "../envelope-imap" }
futures = "0.3.34"
hickory-resolver = { version = "0.26.3", features = ["tokio"] }
html-escape = "0.3.0"
iana-time-zone = "0.1.65"
imap-proto = "0.17.0"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "smtp-transport", "builder", "rustls-native-certs", "aws-lc-rs"] }
mail-builder = "2.0.0"
mail-parser = "1.0.0"
mime_guess = "2.0.5"
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "gzip", "brotli", "charset", "http2", "system-proxy", "form", "query"] }
rrule = "0.14.0"
rusqlite = { version = "0.41.0", features = ["bundled", "serde_json", "functions"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
zstd = "0.14.3"
