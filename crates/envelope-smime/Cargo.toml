[package]
name = "envelope-smime"
description = "S/MIME for Envelope: certificates, PKCS #12, CMS signatures and encryption, and S/MIME messages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
aes-kw = { version = "0.2.1", features = ["alloc"] }
base64 = { workspace = true }
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
cms = { version = "0.2.3", features = ["std"] }
const-oid = "0.9.6"
der = { version = "0.7.10", features = ["alloc", "oid", "std"] }
des = "0.8.1"
hmac = "0.12.1"
mail-parser = "1.0.0"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.13.1", features = ["ecdh", "ecdsa", "pkcs8"] }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
pkcs12 = { version = "0.1.0", features = ["kdf"] }
pkcs8 = { version = "0.10.2", features = ["alloc", "pem"] }
rand = "0.8"
rc2 = "0.8.1"
rsa = "0.9.10"
sha1 = { version = "0.10.6", features = ["oid"] }
sha2 = { version = "0.10.9", features = ["oid"] }
spki = { version = "0.7.3", features = ["alloc"] }
thiserror = { workspace = true }
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "pem"] }
zeroize = "1.8"
