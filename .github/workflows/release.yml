name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Linux bundles
    # The oldest supported runner keeps the AppImage and .deb compatible with older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            patchelf rpm file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OAuth clients for Google and Microsoft sign-in (see docs/OAUTH.md).
          ENVELOPE_GOOGLE_CLIENT_ID: ${{ secrets.ENVELOPE_GOOGLE_CLIENT_ID }}
          ENVELOPE_GOOGLE_CLIENT_SECRET: ${{ secrets.ENVELOPE_GOOGLE_CLIENT_SECRET }}
          ENVELOPE_MICROSOFT_CLIENT_ID: ${{ secrets.ENVELOPE_MICROSOFT_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Envelope ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
