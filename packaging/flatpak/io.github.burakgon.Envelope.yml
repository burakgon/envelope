# Flatpak manifest for local builds; the Flathub copy builds a release tag
# instead of this checkout. The offline dependency sources come from the lock
# files (see generate-sources.sh), then:
#   git submodule update --init packaging/flatpak/shared-modules
#   flatpak-builder --user --install --force-clean build io.github.burakgon.Envelope.yml
id: io.github.burakgon.Envelope
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: envelope
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  # Tray icon (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Saving attachments without a file chooser round-trip.
  - --filesystem=xdg-download
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
modules:
  # Tray icon support; Envelope runs without one when it is missing.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: envelope
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/envelope/cargo
        CARGO_NET_OFFLINE: 'true'
        npm_config_cache: /run/build/envelope/flatpak-node/npm-cache
        npm_config_offline: 'true'
        XDG_CACHE_HOME: /run/build/envelope/flatpak-node/cache
    build-commands:
      - npm ci --offline --ignore-scripts
      - npm run build
      # tauri/custom-protocol serves the bundled interface instead of the development server.
      - cargo build --offline --release -p envelope --features tauri/custom-protocol
      - install -Dm755 target/release/envelope /app/bin/envelope
      - install -Dm644 packaging/linux/io.github.burakgon.Envelope.desktop -t /app/share/applications
      - install -Dm644 packaging/linux/io.github.burakgon.Envelope.metainfo.xml -t /app/share/metainfo
      - mkdir -p /app/share/icons && cp -r packaging/icons/hicolor /app/share/icons/
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - node_modules
          - dist
          - dist-demo
          - .devserver
          - packaging/flatpak/build
          - packaging/flatpak/.flatpak-builder
      - cargo-sources.json
      - node-sources.json
