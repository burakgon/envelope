# Flatpak manifest. The offline dependency sources are generated from the lock files:
#   flatpak-cargo-generator ../../Cargo.lock -o cargo-sources.json
#   flatpak-node-generator npm ../../package-lock.json -o node-sources.json
# then:
#   flatpak-builder --user --install --force-clean build io.github.burakgon.Envelope.yml
id: io.github.burakgon.Envelope
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: envelope
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  # Tray icon (StatusNotifierItem) and starting at login.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-config/autostart:create
  # Saving attachments without a file chooser round-trip.
  - --filesystem=xdg-download
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/envelope/cargo
    CARGO_NET_OFFLINE: 'true'
    npm_config_cache: /run/build/envelope/flatpak-node/npm-cache
    npm_config_offline: 'true'
    XDG_CACHE_HOME: /run/build/envelope/flatpak-node/cache
modules:
  - name: envelope
    buildsystem: simple
    build-commands:
      - npm ci --offline --ignore-scripts
      - npm run build
      # tauri/custom-protocol serves the bundled interface instead of the development server.
      - cargo build --offline --release -p envelope --features tauri/custom-protocol
      - install -Dm755 target/release/envelope /app/bin/envelope
      - install -Dm644 packaging/linux/io.github.burakgon.Envelope.desktop -t /app/share/applications
      - install -Dm644 packaging/linux/io.github.burakgon.Envelope.metainfo.xml -t /app/share/metainfo
      - mkdir -p /app/share/icons && cp -r packaging/icons/hicolor /app/share/icons/
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - node_modules
          - dist
          - .devserver
      - cargo-sources.json
      - node-sources.json
